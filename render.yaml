services:
  - type: web
    name: get-attended
    env: node
    buildCommand: npm install --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        value: attend
      - key: DB_PORT
        value: 3306
      - key: DB_SSL
        value: "false"
      - key: API_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
